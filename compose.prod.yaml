services:
  api:
    command:
      [
        "sh",
        "-c",
        "node dist/database/run-migrations.js && node dist/main.js",
      ]
    environment:
      EVDP_ALLOW_LOCAL_DEFAULT_PASSWORDS: "false"
      NODE_ENV: production

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    environment:
      BACKEND_INTERNAL_URL: http://api:4000/api/v1
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HOST_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
